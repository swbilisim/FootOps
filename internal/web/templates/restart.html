{{template "top" .}}
<div class="dialog">
  <a class="crumb" href="/containers/{{.Data.Name}}">{{icon "back"}}{{.Data.Name}}</a>
  <div class="card">
    <div class="dialog-icon">{{icon "restart"}}</div>
    <h1>{{.Data.Name}} yeniden başlatılsın mı?</h1>
    <p>Container durdurulup tekrar başlatılır; birkaç saniye erişilemeyebilir.</p>
    <form method="post" action="/containers/{{.Data.Name}}/restart">
      <input type="hidden" name="csrf" value="{{.Session.CSRF}}">
      <div class="form-actions">
        <button type="submit" class="primary">{{icon "restart"}}Evet, yeniden başlat</button>
        <a class="btn" href="/containers/{{.Data.Name}}">Vazgeç</a>
      </div>
    </form>
  </div>
</div>
{{template "bottom" .}}
