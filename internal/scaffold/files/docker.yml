# main'e her push'ta imajı derler ve GHCR'ye gönderir: [[.Image]]:main (sunucu
# bunu çeker) ve [[.Image]]:sha-<kısa commit> (geri dönmek için).
# FootOps "Projeni hazırla" ile üretildi.
name: Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  imaj:
    runs-on: [[.Runner]]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: [[.Image]]
          # :main yalnız main'den (başka daldan elle çalıştırılırsa yalnız sha-* basılır)
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: [[.Platform]]
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
